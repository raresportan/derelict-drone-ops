# Builds the game and publishes its renderer to GitHub Pages on every push to main.
# The gate runs locally before a push (marram's pre-push hook, full tier), so CI only builds and deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'package-lock.json', 'electron.vite.config.ts', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/renderer
      - id: deployment
        uses: actions/deploy-pages@v5
